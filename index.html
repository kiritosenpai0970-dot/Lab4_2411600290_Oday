<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Portal</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light login-page">

    <main class="container mt-5">

        <!-- Branding -->
        <header class="text-center mb-4">
            <img src="assets/logo.png" alt="Student Grade Portal Logo" width="120"
                 onerror="this.style.display='none'">
            <h1>Student Grade Portal</h1>
            <p>Access your grades, courses, and assignments</p>
        </header>

        <!-- Login Card -->
        <div class="card mx-auto p-4 login-card shadow-hover">
            <form id="loginForm">

                <input type="text" id="username" class="form-control mb-3"
                       placeholder="Username" aria-label="Username" required>

                <input type="password" id="password" class="form-control mb-3"
                       placeholder="Password" aria-label="Password" required>

                <p class="text-center demo-text mb-3">Demo: admin / password123</p>

                <button type="button" class="btn btn-primary w-100" id="loginBtn">Login</button>

                <div id="loginFeedback" class="mt-3"></div>
            </form>
        </div>

    </main>

    <!-- Bootstrap 5 JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/login.js"></script>

</body>
</html>
